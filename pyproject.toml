[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbound"
version = "1.1.0.dev0"
description = "Does an LLM agent stay inside the task it was given?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["llm", "agents", "benchmark", "evaluation", "scope", "hpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The harness is standard-library only. Everything below is an adapter or a
# development tool, so a run that talks to one provider does not pull in the
# other. `taskbound.runner validate`, `power` and `coverage` need none of them.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
test = ["pytest>=8"]
all = ["anthropic>=0.40", "openai>=1.40", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/Artlands/TaskBound"
Issues = "https://github.com/Artlands/TaskBound/issues"

[project.scripts]
taskbound = "taskbound.runner:main"

[tool.setuptools]
packages = ["taskbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` marks test_power.py and test_analysis.py: 28 of the suite's 34 minutes,
# measured 2026-09-03. `-m "not slow"` is 290 tests in ~6 minutes and is the
# check to run before a patch; CI runs both tiers.
markers = [
    "slow: statistical simulation or a GLMM fit per test; minutes, not seconds",
]
# A misspelled marker is silently a no-op otherwise, and the whole point of the
# tier is that `-m "not slow"` really does skip the expensive files.
addopts = "--strict-markers"
